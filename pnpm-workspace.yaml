packages:
  - 'lessons/*'
  - 'lessons/*/*'
  # 单独克隆的第三方项目有自己的依赖和 Git 状态，不纳入本仓库安装。
  - '!lessons/32_pgsql-test/typeorm-pg-crud'

nodeLinker: hoisted

overrides:
  which-typed-array: 1.1.22

allowBuilds:
  '@google/genai': true
  better-sqlite3: true
  esbuild: true
  protobufjs: true
  unrs-resolver: false

minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.33'
  - '@ai-sdk/langchain@3.0.44'
  - '@ai-sdk/provider-utils@5.0.16'
  - ai@7.0.44
